<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <Style>
        #container{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            border: 2px solid red;
            height: 200px; 
        }
        .box {
            width: 100px;
            height: 100px;
            background-color: skyblue;
            border: 2px solid blue;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }
        h1{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: medium;
            font-weight: bold;
            font-style: italic;
        }
    </Style>
</head>
<body>
    <div id="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <!--Typography-->
    <h1>Welcome to Web Session </h1>
</body>
</html>
