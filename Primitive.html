<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let name = "Sudha";        // string
        let age = 24;              // number
        let isStudent = true;      // boolean
        let city;                  // undefined
        let score = null;          // null
        let bigNum = 12345678901234567890n;  // bigint
        let id = Symbol("id"); //Symbol

        console.log(name);
        console.log(age);
        console.log(isStudent);
        console.log(city);
        console.log(score);
        console.log(bigNum);
        console.log(id);
    </script>
</body>
</html>
